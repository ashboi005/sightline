[project]
name = "gaze-viewer-vision"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi>=2026.10.19",
    "pillow>=13.0.0,<14",
    "opencv-python>=4.13,<5",
    "ultralytics==8.4.173",
    "sam-2==1.0",
    "timm==1.0.22",
    "kornia==0.8.3",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

[tool.uv.sources]
sam-2 = { git = "https://github.com/facebookresearch/sam2.git", rev = "2b90b9f5ceec907a1c18123530e92e794ad901a4" }
