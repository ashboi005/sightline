[project]
name = "sightline-sign-service"
version = "0.1.0"
description = "Webcam frames -> sign gloss tokens (owner: Harnoor)"
requires-python = ">=3.10"
dependencies = [
  "websockets>=13,<18",
  "mediapipe>=0.10.20,<0.10.22",
  "opencv-contrib-python>=4.11,<5",
  "numpy>=1.24,<3",
  "torch>=2.0,<3",
  "transformers>=4.46,<5",
  "huggingface-hub>=0.25,<2",
]

[project.optional-dependencies]
test = ["jsonschema>=4.20", "pytest>=8"]

[project.scripts]
sign-service = "sign_service.server:main"
sign-service-camera = "sign_service.camera_client:main"

[tool.setuptools.packages.find]
include = ["sign_service*"]
