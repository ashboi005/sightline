[project]
name = "sightline-gaze-bridge"
version = "0.1.0"
description = "Local daemon: eye tracker -> gaze zones + scene gaze for look-to-hear (software: Ashwath, tracker hardware: Arunya)"
requires-python = ">=3.12,<3.13"
dependencies = ["websockets>=13"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "jsonschema>=4.23"]

[project.scripts]
gaze-bridge = "gaze_bridge.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
