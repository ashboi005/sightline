[project]
name = "sightline-speaker-service"
version = "0.1.0"
description = "Sightline look-to-hear: gaze-selected audio-visual target speaker extraction"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "python-multipart>=0.0.20",
  "numpy>=2.2",
  "scipy>=1.15",
  "torch>=2.6",
  "torchvision>=0.21",
  "opencv-contrib-python>=4.11",
  "mediapipe==0.10.35",
  "pyyaml>=6.0.2",
  "sru>=2.6",
  "ninja>=1.11",
  "einops>=0.8",
  "rotary-embedding-torch==0.8.3",
  "thop>=0.1.1",
  "timm>=1.0",
  "soundfile>=0.13",
  "httpx>=0.28",
  "psutil>=7.0",
  "websockets>=15,<17",
  "pillow>=11",
  # Native RNNoise wheels exist for Linux, Windows and macOS 26+ only; elsewhere `--noise auto`
  # falls back to the explicit passthrough (reported as noise_processor "off").
  "pyrnnoise==0.4.5; sys_platform != 'darwin' or platform_release >= '25'",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[project.scripts]
sightline-speaker = "sightline_speaker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sightline_speaker", "third_party/rtfs_net", "third_party/av_mossformer2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["model: requires real downloaded pretrained checkpoints"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
