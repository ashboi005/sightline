name: sightline

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets:
        - web_env
        - server_env
      args:
        NEXT_PUBLIC_SERVER_URL: http://localhost:3000
        NEXT_PUBLIC_SERVER_WS_URL: ws://localhost:3000
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      SERVER_URL: http://server:3000
      NEXT_PUBLIC_SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      secrets:
        - web_env
        - server_env
    init: true
    ports:
      - "3000:3000"
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      CORS_ORIGIN: http://localhost:3001
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

# BuildKit makes these available only while install/build commands run.
secrets:
  web_env:
    file: apps/web/.env
  server_env:
    file: apps/server/.env
